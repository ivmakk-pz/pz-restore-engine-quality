name: Bug report
description: Something in Restore Engine Quality is broken or behaves wrong in-game.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in the fields below - the game build, the mode, and a log excerpt are what make a bug reproducible. General questions are better as a [Steam Workshop comment](https://steamcommunity.com/sharedfiles/filedetails/?id=3543612325).

  - type: input
    id: game-build
    attributes:
      label: Game build
      description: The Project Zomboid build you are on (title screen, bottom corner).
      placeholder: "42.20.1"
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: Restore Engine Quality version (Workshop change notes, or the value in mod.info).
      placeholder: "1.2.1"
    validations:
      required: true

  - type: dropdown
    id: game-mode
    attributes:
      label: Game mode
      description: Where does it happen?
      options:
        - Singleplayer
        - Hosted co-op (in-game host)
        - Dedicated server
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: mod-isolation
    attributes:
      label: Does it still happen with other mods disabled?
      description: Please don't list every enabled mod - instead test with only Restore Engine Quality enabled and tell us the result. This is the single most useful thing for ruling out a mod conflict.
      options:
        - "Yes - it still happens with only Restore Engine Quality enabled"
        - "No - it goes away when I disable my other mods"
        - "I haven't tested with other mods disabled"
    validations:
      required: true

  - type: input
    id: suspected-conflict
    attributes:
      label: Suspected conflicting mod (optional)
      description: If disabling other mods fixed it and you narrowed it down, name the mod (and its Workshop link if handy).
      placeholder: "e.g. SomeVehicleOverhaul - https://steamcommunity.com/..."
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step?
      placeholder: |
        1. Spawn / find a vehicle with a sub-100% engine
        2. Open Vehicle Mechanics, right-click the engine
        3. Click "Restore Engine Quality"
        4. ...
    validations:
      required: true

  - type: textarea
    id: what-went-wrong
    attributes:
      label: What went wrong?
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: |
        Paste the relevant lines. Logs live in `%USERPROFILE%\Zomboid\Logs\` - the newest `*_DebugLog.txt` (client) and, for multiplayer, `*_DebugLog-server.txt` (server). `%USERPROFILE%\Zomboid\console.txt` also holds `[REQ]`-prefixed messages. Enabling `DEBUG_MODE` (see the README) surfaces more detail.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I'm on the latest version (re-subscribe on the Workshop to force Steam to re-download it).
          required: true
